name: Build Library Preview Flatpak

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3
      - name: Build the preview bundle
        run: dbus-run-session -- ./packaging/flatpak/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LutrisLibrary-flatpak
          path: dist/LutrisLibrary.flatpak
          if-no-files-found: error
