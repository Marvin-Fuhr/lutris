name: Build Library Preview Flatpak

on:
  workflow_dispatch:
  push:
    tags:
      - "library-preview-v*"

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak build tools
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder python3 librsvg2-common
      - name: Build the preview bundle
        run: dbus-run-session -- ./packaging/flatpak/build.sh
      - name: Calculate checksum
        working-directory: dist
        run: sha256sum LutrisLibrary.flatpak > LutrisLibrary.flatpak.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LutrisLibrary-flatpak
          path: |
            dist/LutrisLibrary.flatpak
            dist/LutrisLibrary.flatpak.sha256
          if-no-files-found: error
      - name: Publish preview release
        if: startsWith(github.ref, 'refs/tags/library-preview-v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/LutrisLibrary.flatpak dist/LutrisLibrary.flatpak.sha256 \
            --verify-tag --target "$RELEASE_COMMIT" --prerelease \
            --title "Lutris Library Preview ${RELEASE_TAG#library-preview-}" \
            --notes-file packaging/flatpak/release-notes.md
